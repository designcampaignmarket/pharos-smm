name: Pharos monitoring

on:
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Опросить все источники сразу"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pharos-monitoring
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run parser
        run: python parser.py ${{ inputs.force && '--force' || '' }}
      - name: Commit results
        run: |
          git config user.name "pharos-monitor"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "monitoring: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
